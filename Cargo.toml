[package]
name = "opendash"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "=0.8.9"
minijinja = { version = "=3.0.5", features = ["fuel"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread"] }
zip = { version = "=9.3.0", default-features = false, features = ["deflate"] }
